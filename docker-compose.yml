services:

  # ==========================================================
  # FastAPI Backend
  # ==========================================================

  api:
    build: .
    container_name: opinionai-api

    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped


  # ==========================================================
  # Streamlit Frontend
  # ==========================================================

  streamlit:
    build: .
    container_name: opinionai-streamlit

    command: >
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8501:8501"

    environment:
      API_URL: http://api:8000/predict

    depends_on:
      - api

    restart: unless-stopped